name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "0"  # run with each platform's default encoding, like users do
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Tests
        run: uv run pytest -q --junitxml=junit.xml
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("junit.xml").iter("testcase"):
              for problem in [*case.iter("failure"), *case.iter("error")]:
                  text = (problem.get("message") or "") + " | " + (problem.text or "").strip().splitlines()[-1:][0:1].__str__()
                  detail = (problem.text or "").strip().replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{detail[-3000:]}")
          PY
      - name: Smoke test
        shell: bash
        env:
          PDMS_CONFIG: ${{ runner.temp }}/pdms/config.toml
          XDG_STATE_HOME: ${{ runner.temp }}/state
        run: |
          uv run pdms --help
          uv run pdms config path
          uv run pdms ps
          uv run pdms repo list
          PDMS_LANG=es uv run pdms --help
      - name: Build
        run: uv build
