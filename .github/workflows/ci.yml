name: CI

# Each commit of a branch runs once, through its pull request; main runs on push. macOS minutes cost 10 times
# Linux ones (Windows, twice), so pull requests run a smaller matrix and main the whole of it.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

# A new commit to a pull request cancels the run of the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        # Pull requests: both Pythons on Linux, the newest on macOS and Windows. main: every OS with both.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[
            {"os": "ubuntu-latest", "python": "3.10"}, {"os": "ubuntu-latest", "python": "3.12"},
            {"os": "macos-latest", "python": "3.12"}, {"os": "windows-latest", "python": "3.12"}
          ]' || '[
            {"os": "ubuntu-latest", "python": "3.10"}, {"os": "ubuntu-latest", "python": "3.12"},
            {"os": "macos-latest", "python": "3.10"}, {"os": "macos-latest", "python": "3.12"},
            {"os": "windows-latest", "python": "3.10"}, {"os": "windows-latest", "python": "3.12"}
          ]') }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "0"  # run with each platform's default encoding, like users do
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q --junitxml=junit.xml 2>&1 | tee pytest.log
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          # Plain bash on purpose: this must work even when the Python environment is the problem.
          if [ -f pytest.log ]; then
            grep -E "^(FAILED|ERROR) " pytest.log | head -n 20 | sed 's/^/::error title=pytest::/' || true
            tail -n 80 pytest.log | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' \
              | sed 's/^/::error title=pytest output (last lines)::/'
            echo
          else
            echo "::error title=pytest::pytest.log was not created"
          fi
      - name: Smoke test
        shell: bash
        env:
          PDMS_CONFIG: ${{ runner.temp }}/pdms/config.toml
          XDG_STATE_HOME: ${{ runner.temp }}/state
        run: |
          uv run pdms --help
          uv run pdms config path
          uv run pdms ps
          uv run pdms repo list
          PDMS_LANG=es uv run pdms --help
      - name: Build
        run: uv build

  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      installers: ${{ steps.diff.outputs.installers }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        name: Did the installers or the packaging change?
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "installers=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(installer/|pyproject\.toml$|uv\.lock$|\.github/workflows/)'; then
            echo "installers=true" >> "$GITHUB_OUTPUT"
          else
            echo "installers=false" >> "$GITHUB_OUTPUT"
          fi

  installers:
    name: installer (${{ matrix.os }})
    # Only when they (or what they install) changed in a pull request; always on main.
    needs: changes
    if: needs.changes.outputs.installers == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build the package
        run: uv build
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          export PDMS_WHEEL="$(ls "$PWD"/dist/*.whl)" PDMS_MENU=1
          sh installer/install.sh
          "$(uv tool dir --bin)/pdms" --version
          "$(uv tool dir --bin)/pdms" --help > /dev/null
          # The app menu entry that PDMS_MENU=1 asked for, and that it goes away.
          if [ "$RUNNER_OS" = macOS ]; then test -x ~/Applications/pdms.app/Contents/MacOS/pdms
          else test -f ~/.local/share/applications/pdms.desktop; fi
          "$(uv tool dir --bin)/pdms" ui --uninstall
      - name: Install with install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PDMS_WHEEL = (Get-ChildItem dist\*.whl).FullName
          $env:PDMS_MENU = "1"
          $ErrorActionPreference = "Continue"
          powershell -ExecutionPolicy ByPass -File installer\install.ps1 *> installer.log
          $code = $LASTEXITCODE
          Get-Content installer.log
          if ($code -ne 0) {
            $tail = (Get-Content installer.log -Tail 40) -join "%0A"
            Write-Output "::error title=install.ps1 failed (exit code $code)::$tail"
            exit $code
          }
          & (Join-Path (uv tool dir --bin).Trim() "pdms.exe") --version
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=pdms --version failed ($LASTEXITCODE)::"; exit $LASTEXITCODE }
          # The Start menu shortcut that PDMS_MENU=1 asked for points to pdmsw.exe (no console window).
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\pdms.lnk"
          $target = if (Test-Path $lnk) { (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath } else { "" }
          Write-Output "pdms.lnk -> $target"
          if (-not "$target".EndsWith("pdmsw.exe")) {
            $tail = (Get-Content installer.log -Tail 25) -join "%0A"
            Write-Output "::error title=Start menu shortcut ($(Test-Path $lnk)) points to '$target'::$tail"
            exit 1
          }
          $out = & (Join-Path (uv tool dir --bin).Trim() "pdms.exe") ui --uninstall 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error title=pdms ui --uninstall failed ($LASTEXITCODE)::$($out -replace "`r?`n", '%0A')"
            exit $LASTEXITCODE
          }

  flyway:
    name: flyway (pdms migrate, real image)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: local
          POSTGRES_DB: pdm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PDMS_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv sync --locked
          # the runner context is only available inside steps
          echo "PDMS_CONFIG=$RUNNER_TEMP/pdms/config.toml" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/state" >> "$GITHUB_ENV"
      # Public ECR caps the data anonymous clients download, and the runners share their IPs with everyone else
      # ("toomanyrequests: Data limit exceeded"), so the image comes from ECR only once per tag and from the cache
      # afterwards.
      - name: Flyway image name
        id: image
        run: echo "name=$(uv run python -c 'from pdms_cli.migrations import IMAGE; print(IMAGE)')" >> "$GITHUB_OUTPUT"
      - name: Restore the Flyway image
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/flyway-image.tar
          key: flyway-image-${{ steps.image.outputs.name }}
      - name: Load the cached Flyway image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/flyway-image.tar"
      - name: Download the Flyway image
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          uv run python -c "
          from pdms_cli.migrations import pull_image
          ok, error = pull_image(attempts=5, wait=30)
          raise SystemExit(0 if ok else f'::error title=docker pull::{error}')"
          docker save -o "$RUNNER_TEMP/flyway-image.tar" '${{ steps.image.outputs.name }}'
      - name: Cache the Flyway image
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/flyway-image.tar
          key: flyway-image-${{ steps.image.outputs.name }}
      - name: A migrations repo like pdms-db-migrations
        run: |
          mkdir -p "$RUNNER_TEMP/pdms/backend/snakesdk" "$RUNNER_TEMP/pdms-db-migrations/migrations/versioned"
          cat > "$RUNNER_TEMP/pdms-db-migrations/flyway.toml" <<'TOML'
          [flyway]
          cleanDisabled = true
          locations = ["filesystem:migrations/versioned"]
          baselineOnMigrate = true
          table = "flyway_schema_history"
          [environments.local]
          schemas = ["public"]
          url = "jdbc:postgresql://${env.DB_HOST}:${env.DB_PORT}/${env.DB_NAME}"
          user = "${env.DB_USER}"
          password = "${env.DB_PASSWORD}"
          TOML
          echo "create table pdms_ci_canary (id int);" > "$RUNNER_TEMP/pdms-db-migrations/migrations/versioned/V2026.01.01.1.01__canary.sql"
          uv run python -c "
          from pdms_cli.config import Config, Database, Repo
          c = Config(repos={'pdms': Repo(path='$RUNNER_TEMP/pdms')}, current_repo='pdms')
          c.dbs = {'local': Database('localhost', port=5432, database='pdm', user='postgres', password='local'),
                   'shared': Database('db.example.com', protected=True)}
          c.save()"
      - name: pdms migrate
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -x
          exec > >(tee "$RUNNER_TEMP/flyway-job.log") 2>&1
          uv run --project "$GITHUB_WORKSPACE" pdms migrate migrate -d local
          uv run --project "$GITHUB_WORKSPACE" pdms migrate info -d local | tee info.txt
          grep -q "canary" info.txt
          uv run --project "$GITHUB_WORKSPACE" pdms migrate validate -d local
          ! uv run --project "$GITHUB_WORKSPACE" pdms migrate migrate -d shared
          PGPASSWORD=local psql -h localhost -U postgres -d pdm -tAc "select count(*) from flyway_schema_history" | grep -qE "^[1-9]"
      - name: Report the failure as an annotation
        if: failure()
        shell: bash
        run: |
          tail -n 60 "$RUNNER_TEMP/flyway-job.log" | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' \
            | sed 's/^/::error title=pdms migrate (last lines)::/'
          echo
