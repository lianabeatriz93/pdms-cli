name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Check that the tag matches the package version
        run: |
          VERSION="$(uv version --short)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in pyproject.toml ($VERSION). Use 'cz bump'."
            exit 1
          fi
      - name: Tests
        run: |
          uv sync --locked
          uv run pytest -q
      - name: Signed extension for Firefox
        # Mozilla signs each version of the extension once (unlisted on addons.mozilla.org): take it from an earlier
        # release while its version is the same, else sign it. Without it pdms still releases, minus Firefox.
        env:
          GH_TOKEN: ${{ github.token }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          XPI="pdms-front-redirect-$(uv run python -m pdms_cli.browser version).xpi"
          mkdir -p xpi
          for tag in $(gh release list --limit 30 --json tagName --jq '.[].tagName'); do
            if gh release download "$tag" --pattern "$XPI" --dir xpi 2>/dev/null; then
              echo "$XPI comes from $tag"
              break
            fi
          done
          if [ ! -f "xpi/$XPI" ]; then
            if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
              echo "::warning::No AMO_JWT_ISSUER / AMO_JWT_SECRET secrets: this release has no extension for Firefox."
              exit 0
            fi
            uv run python -m pdms_cli.browser firefox-source firefox-source
            if ! npx --yes web-ext@8 sign --source-dir firefox-source --artifacts-dir signed --channel unlisted \
                --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"; then
              echo "::warning::Mozilla did not sign $XPI: this release has no extension for Firefox."
              exit 0
            fi
            mv signed/*.xpi "xpi/$XPI"
          fi
          cp "xpi/$XPI" src/pdms_cli/browser_extension/firefox.xpi
      - name: Build
        run: uv build
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ## Install

          macOS / Linux:
          ```sh
          curl -LsSf https://github.com/lianabeatriz93/pdms-cli/releases/latest/download/install.sh | sh
          ```

          Windows (PowerShell):
          ```powershell
          powershell -ExecutionPolicy ByPass -c "irm https://github.com/lianabeatriz93/pdms-cli/releases/latest/download/install.ps1 | iex"
          ```

          Already installed: `pdms self-update`.
          NOTES
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp installer/install.sh installer/install.ps1 dist/
          cp xpi/*.xpi dist/ 2>/dev/null || true  # pdms installed from a checkout downloads it from here
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*) PRERELEASE="--prerelease" ;;  # alpha/beta/rc: not "latest"
          esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "pdms $GITHUB_REF_NAME" --notes-file notes.md $PRERELEASE
