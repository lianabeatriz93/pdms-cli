[project]
name = "pdms-cli"
version = "0.3.2"
description = "Interactive CLI to run PDMS services locally."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "rich>=13",
    "tomlkit>=0.12",
    "psycopg[binary]>=3.1",
    "python-hcl2>=8.1.4",
    "psutil>=5.9",
]

[project.optional-dependencies]
# pdms ui --window. Linux uses the Qt backend: its wheels need no system packages to build, unlike GTK's PyGObject.
# The tray icon is Qt's on Linux and pystray's elsewhere.
desktop = [
    "pywebview>=5",
    "pywebview[qt]>=5; sys_platform == 'linux'",
    "pystray>=0.19; sys_platform != 'linux'",
]

[dependency-groups]
dev = [
    "botocore>=1.29",
    "pytest>=8",
]

[project.scripts]
pdms = "pdms_cli.launcher:main"

# The same pdms without a console window on Windows, for the app menu shortcut (pdms ui --install).
[project.gui-scripts]
pdmsw = "pdms_cli.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdms_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_merge_prerelease = true
major_version_zero = true
bump_message = "bump: version $current_version → $new_version"
