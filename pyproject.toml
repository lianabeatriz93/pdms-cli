[project]
name = "pdms-cli"
version = "0.2.3"
description = "Interactive CLI to run PDMS services locally."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "rich>=13",
    "tomlkit>=0.12",
    "psycopg[binary]>=3.1",
    "python-hcl2>=8.1.4",
    "psutil>=5.9",
]

[dependency-groups]
dev = [
    "botocore>=1.29",
    "pytest>=8",
]

[project.scripts]
pdms = "pdms_cli.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdms_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_merge_prerelease = true
major_version_zero = true
bump_message = "bump: version $current_version → $new_version"
