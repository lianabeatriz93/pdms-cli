name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "0"  # run with each platform's default encoding, like users do
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q --junitxml=junit.xml 2>&1 | tee pytest.log
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          # Plain bash on purpose: this must work even when the Python environment is the problem.
          if [ -f pytest.log ]; then
            grep -E "^(FAILED|ERROR) " pytest.log | head -n 20 | sed 's/^/::error title=pytest::/' || true
            tail -n 80 pytest.log | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' \
              | sed 's/^/::error title=pytest output (last lines)::/'
            echo
          else
            echo "::error title=pytest::pytest.log was not created"
          fi
      - name: Smoke test
        shell: bash
        env:
          PDMS_CONFIG: ${{ runner.temp }}/pdms/config.toml
          XDG_STATE_HOME: ${{ runner.temp }}/state
        run: |
          uv run pdms --help
          uv run pdms config path
          uv run pdms ps
          uv run pdms repo list
          PDMS_LANG=es uv run pdms --help
      - name: Build
        run: uv build

  installers:
    name: installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build the package
        run: uv build
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          export PDMS_WHEEL="$(ls "$PWD"/dist/*.whl)"
          sh installer/install.sh
          "$(uv tool dir --bin)/pdms" --version
          "$(uv tool dir --bin)/pdms" --help > /dev/null
      - name: Install with install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:PDMS_WHEEL = (Get-ChildItem dist\*.whl).FullName
          $ErrorActionPreference = "Continue"
          powershell -ExecutionPolicy ByPass -File installer\install.ps1 *> installer.log
          $code = $LASTEXITCODE
          Get-Content installer.log
          if ($code -ne 0) {
            $tail = (Get-Content installer.log -Tail 40) -join "%0A"
            Write-Output "::error title=install.ps1 failed (exit code $code)::$tail"
            exit $code
          }
          & (Join-Path (uv tool dir --bin).Trim() "pdms.exe") --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
