[project]
name = "pdms-cli"
version = "0.1.0"
description = "CLI interactivo para levantar servicios de PDMS en local."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "rich>=13",
    "tomlkit>=0.12",
    "psycopg[binary]>=3.1",
]

[project.scripts]
pdms = "pdms_cli.cli:_entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdms_cli"]
