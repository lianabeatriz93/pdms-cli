[project]
name = "pdms-cli"
version = "0.1.0"
description = "Interactive CLI to run PDMS services locally."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "rich>=13",
    "tomlkit>=0.12",
    "psycopg[binary]>=3.1",
    "python-hcl2>=8.1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
pdms = "pdms_cli.cli:_entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdms_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
